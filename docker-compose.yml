services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wo_user
      POSTGRES_PASSWORD: wo_pass
      POSTGRES_DB: wo_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wo_user -d wo_db"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wo_user
      DB_PASSWORD: wo_pass
      DB_NAME: wo_db
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # URL the browser uses to reach the backend (published on host port 3000)
        VITE_API_URL: http://localhost:3000/api
    ports:
      - "8080:80"
    depends_on:
      - backend

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  pgdata:
